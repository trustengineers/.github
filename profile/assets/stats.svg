<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-labelledby="t d">
  <title id="t">TrustEngineers track record</title>
  <desc id="d">Four figures: 10+ years of production engineering since 2015; 5.0 client reviews on every completed contract; 100% Job Success, founder rated Top Rated Plus on Upwork; a team of 11 to 50 people working with clients in the US and worldwide.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8aaeff"/>
      <stop offset="1" stop-color="#ff6b6b"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c1"><rect x="0" y="5" width="285" height="180" rx="16"/></clipPath>
    <clipPath id="c2"><rect x="305" y="5" width="285" height="180" rx="16"/></clipPath>
    <clipPath id="c3"><rect x="610" y="5" width="285" height="180" rx="16"/></clipPath>
    <clipPath id="c4"><rect x="915" y="5" width="285" height="180" rx="16"/></clipPath>
  </defs>

  <style>
    text { font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .card { fill: #0f1f3f; stroke: #8caaeb; stroke-opacity: .18; }
    .num { font-size: 50px; font-weight: 700; letter-spacing: -1px; fill: url(#brand); }
    .lbl { font-size: 17px; fill: #cfd8ea; }
    .bar { fill: url(#brand); transform-box: fill-box; transform-origin: left center; animation: grow 1.2s cubic-bezier(.2,.7,.2,1) both; }
    .in { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
    .d2 { animation-delay: .15s; } .d3 { animation-delay: .3s; } .d4 { animation-delay: .45s; }
    .d2 .bar { animation-delay: .15s; } .d3 .bar { animation-delay: .3s; } .d4 .bar { animation-delay: .45s; }
    .sheen { animation: sweep 6s ease-in-out infinite; }
    .s2 { animation-delay: .5s; } .s3 { animation-delay: 1s; } .s4 { animation-delay: 1.5s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes sweep { 0%, 55% { transform: translateX(-160px); } 85%, 100% { transform: translateX(420px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .sheen { display: none; } }
  </style>

  <g class="in">
    <rect class="card" x=".5" y="5.5" width="284" height="179" rx="16"/>
    <g clip-path="url(#c1)"><rect class="sheen" x="0" y="5" width="120" height="180" fill="url(#sheen)"/></g>
    <text class="num" x="24" y="72">10+</text>
    <rect class="bar" x="24" y="88" width="56" height="4" rx="2"/>
    <text class="lbl" x="24" y="124">years of production</text>
    <text class="lbl" x="24" y="148">engineering, since 2015</text>
  </g>

  <g class="in d2">
    <rect class="card" x="305.5" y="5.5" width="284" height="179" rx="16"/>
    <g clip-path="url(#c2)"><rect class="sheen s2" x="305" y="5" width="120" height="180" fill="url(#sheen)"/></g>
    <text class="num" x="329" y="72">5.0</text>
    <rect class="bar" x="329" y="88" width="56" height="4" rx="2"/>
    <text class="lbl" x="329" y="124">client reviews on every</text>
    <text class="lbl" x="329" y="148">completed contract</text>
  </g>

  <g class="in d3">
    <rect class="card" x="610.5" y="5.5" width="284" height="179" rx="16"/>
    <g clip-path="url(#c3)"><rect class="sheen s3" x="610" y="5" width="120" height="180" fill="url(#sheen)"/></g>
    <text class="num" x="634" y="72">100%</text>
    <rect class="bar" x="634" y="88" width="56" height="4" rx="2"/>
    <text class="lbl" x="634" y="124">Job Success. Founder is</text>
    <text class="lbl" x="634" y="148">Top Rated Plus on Upwork</text>
  </g>

  <g class="in d4">
    <rect class="card" x="915.5" y="5.5" width="284" height="179" rx="16"/>
    <g clip-path="url(#c4)"><rect class="sheen s4" x="915" y="5" width="120" height="180" fill="url(#sheen)"/></g>
    <text class="num" x="939" y="72">11-50</text>
    <rect class="bar" x="939" y="88" width="56" height="4" rx="2"/>
    <text class="lbl" x="939" y="124">people, with clients in</text>
    <text class="lbl" x="939" y="148">the US and worldwide</text>
  </g>
</svg>
